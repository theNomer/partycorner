<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Would You Rather - Party Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../main.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="https://partycorner.denomer.fun">Party Corner</a></h1>
    <a class="home" href="https://denomer.fun">deNomer</a>
  </header>

  <main class="page">
    <div class="game-head">
      <p class="label">Game four</p>
      <h2 class="section-title">Would You <span class="pink">Rather?</span></h2>
    </div>

    <div class="panel">
      <!-- Step 1: pick question types -->
      <section id="setup">
        <p>Rules: Read both options out loud. Everyone says A or B at the same time (or holds up one or two fingers). The smaller side drinks.</p>

        <h2>Pick your vibe</h2>
        <div id="categories" class="chips">
          <!-- one chip per question type, filled in by game.js -->
          <label class="chip chip-fun">
            <input type="checkbox" id="all-categories">
            <span>Give Me Crazy</span>
          </label>
        </div>

        <button id="start" disabled>Start game</button>
      </section>

      <!-- Step 2: show A and B, everyone picks one -->
      <section id="play" hidden>
        <p class="label prefix">Would you rather...</p>
        <div class="options">
          <div class="option option-a">
            <span class="option-letter">A</span>
            <p id="option-a"></p>
          </div>
          <span class="or">or</span>
          <div class="option option-b">
            <span class="option-letter">B</span>
            <p id="option-b"></p>
          </div>
        </div>
        <div class="play-buttons">
          <button id="change-vibe" class="button-ghost">Change vibe</button>
          <button id="next">Next question</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../shared.js"></script>
  <script src="prompts.js"></script>
  <script src="game.js"></script>
</body>
</html>
