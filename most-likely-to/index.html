<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Most Likely To - Party Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../main.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="https://partycorner.denomer.fun">Party Corner</a></h1>
    <a class="home" href="https://denomer.fun">deNomer</a>
  </header>

  <main class="page">
    <div class="game-head">
      <p class="label">Game three</p>
      <h2 class="section-title">Most Likely <span class="pink">To.</span></h2>
    </div>

    <div class="panel">
      <!-- Step 1: pick prompt types -->
      <section id="setup">
        <p>Rules: Read the prompt, hit the countdown, and on POINT! everyone points at someone (or types a name in the call chat). Most fingers on you? Drink.</p>

        <h2>Pick your vibe</h2>
        <div id="categories" class="chips">
          <!-- one chip per prompt type, filled in by game.js -->
          <label class="chip chip-fun">
            <input type="checkbox" id="all-categories">
            <span>Give Me Crazy</span>
          </label>
        </div>

        <button id="start" disabled>Start game</button>
      </section>

      <!-- Step 2: show a prompt, count down, everyone points -->
      <section id="play" hidden>
        <p class="label prefix">Who's most likely to...</p>
        <h2 id="prompt-text" class="prompt-text"></h2>
        <p id="countdown" class="countdown" hidden aria-live="assertive"></p>
        <div class="play-buttons">
          <button id="count">3, 2, 1...</button>
        </div>
        <div class="play-buttons">
          <button id="change-vibe" class="button-ghost">Change vibe</button>
          <button id="next" class="button-ghost">Next prompt</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../shared.js"></script>
  <script src="prompts.js"></script>
  <script src="game.js"></script>
</body>
</html>
